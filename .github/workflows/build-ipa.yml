name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build VideoPlayer IPA
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode
        run: xcodebuild -version

      - name: Prepare video player library
        run: pod install --project-directory=VideoPlayer

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace VideoPlayer/VideoPlayer.xcworkspace \
            -scheme VideoPlayer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          echo "=== Searching for .app ==="
          find build -name "*.app" -type d
          APP_PATH="build/Build/Products/Release-iphoneos/VideoPlayer.app"
          echo "Using app path: $APP_PATH"
          ls -la "$APP_PATH"
          ls -la "$APP_PATH"/
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          echo "=== Payload contents ==="
          ls -la Payload/
          ls -la Payload/VideoPlayer.app/
          zip -qr VideoPlayer-unsigned.ipa Payload
          ls -lh VideoPlayer-unsigned.ipa
          echo "=== IPA size ==="
          du -h VideoPlayer-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-unsigned
          path: VideoPlayer-unsigned.ipa
          if-no-files-found: error
