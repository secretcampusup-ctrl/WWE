name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build VideoPlayer IPA
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode
        run: xcodebuild -version

      - name: Cache CocoaPods downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('VideoPlayer/Podfile', 'VideoPlayer/*.podspec') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      - name: Prepare video player library
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3 4; do
            if pod install --project-directory=VideoPlayer; then
              exit 0
            fi

            if [ "$attempt" -eq 4 ]; then
              echo "CocoaPods installation failed after $attempt attempts."
              exit 1
            fi

            delay=$((attempt * 15))
            echo "CocoaPods request failed; retrying in ${delay}s (attempt $((attempt + 1))/4)."
            sleep "$delay"
          done

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace VideoPlayer/VideoPlayer.xcworkspace \
            -scheme VideoPlayer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          echo "=== Searching for .app ==="
          find build -name "*.app" -type d
          APP_PATH="build/Build/Products/Release-iphoneos/VideoPlayer.app"
          echo "Using app path: $APP_PATH"
          ls -la "$APP_PATH"
          ls -la "$APP_PATH"/
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          echo "=== Payload contents ==="
          ls -la Payload/
          ls -la Payload/VideoPlayer.app/
          zip -qr VideoPlayer-unsigned.ipa Payload
          ls -lh VideoPlayer-unsigned.ipa
          echo "=== IPA size ==="
          du -h VideoPlayer-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-unsigned
          path: VideoPlayer-unsigned.ipa
          if-no-files-found: error
