workflows:
  ios-unsigned-ipa:
    name: Build Unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Prepare video player library
        script: pod install --project-directory=VideoPlayer
      - name: Build unsigned app
        script: |
          set -e
          xcodebuild \
            -workspace VideoPlayer/VideoPlayer.xcworkspace \
            -scheme VideoPlayer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64" \
            build
      - name: Package IPA
        script: |
          set -e
          APP_PATH=$(find build -name "VideoPlayer.app" -type d | head -n 1)
          echo "App: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr VideoPlayer-unsigned.ipa Payload
    artifacts:
      - VideoPlayer-unsigned.ipa
