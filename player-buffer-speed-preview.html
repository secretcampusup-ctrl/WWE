<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>V Player — Buffer Speed Preview</title>
  <style>
    :root { color-scheme: dark; --accent:#6e5cff; --blue:#2997ff; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center;
      background:radial-gradient(circle at 50% 0%,#24232b 0,#0b0b0d 44%,#050506 100%);
      color:#fff; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;
      padding:24px;
    }
    .stage { width:min(1120px,100%); }
    .player {
      position:relative; overflow:hidden; isolation:isolate; aspect-ratio:16/9;
      border-radius:28px; background:#050506;
      box-shadow:0 30px 90px #000c,0 0 0 1px #ffffff12;
    }
    .scene {
      position:absolute; inset:7% 0;
      background:
        radial-gradient(circle at 63% 38%,#d9b28b 0 3%,transparent 3.3%),
        radial-gradient(ellipse at 65% 47%,#423329 0 11%,transparent 11.4%),
        radial-gradient(ellipse at 36% 44%,#756155 0 13%,transparent 13.4%),
        linear-gradient(112deg,#16232b 0 30%,#725f52 47%,#26343e 69%,#111920 100%);
      filter:saturate(.82) brightness(.64);
      transform:scale(1.02);
    }
    .scene::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg,#0008,transparent 35%,transparent 65%,#0008); }
    .chrome { position:absolute; inset:0; z-index:4; pointer-events:none; }
    .top { position:absolute; top:22px; left:24px; right:24px; display:flex; direction:ltr; justify-content:space-between; }
    .round { width:46px; height:46px; border-radius:50%; display:grid; place-items:center; background:#1119; border:1px solid #fff2; backdrop-filter:blur(18px); font-size:24px; }
    .quality { padding:8px 13px; border-radius:999px; background:#ffb228; color:#17100a; font:800 13px/1 system-ui; box-shadow:0 5px 22px #ff9d0044; }
    .loading { position:absolute; inset:0; display:grid; place-items:center; z-index:6; transition:.35s ease; }
    .loading.hidden { opacity:0; transform:scale(.92); pointer-events:none; }
    .loader-card { filter:drop-shadow(0 3px 9px #000) drop-shadow(0 10px 28px #000b); }
    .speed-row { display:flex; direction:ltr; align-items:center; gap:14px; }
    .speed { font-size:19px; font-weight:780; letter-spacing:.1px; direction:ltr; font-variant-numeric:tabular-nums; }
    .speed small { color:#ffffffad; font-size:13px; font-weight:680; }
    .separator { position:relative; width:7px; height:7px; transform:rotate(45deg); border-radius:2px; background:linear-gradient(135deg,var(--blue),var(--accent)); box-shadow:0 0 9px #6d5cffb8; }
    .percent { min-width:43px; color:#fff; font-size:17px; font-weight:800; font-variant-numeric:tabular-nums; }
    .bottom { position:absolute; left:28px; right:28px; bottom:25px; direction:ltr; }
    .timeline { height:4px; background:#ffffff2b; border-radius:99px; overflow:hidden; }
    .timeline span { display:block; width:34%; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--blue),var(--accent)); }
    .meta { display:flex; justify-content:space-between; margin-top:10px; color:#fff9; font-size:12px; }
    .panel { margin-top:18px; display:flex; align-items:center; justify-content:space-between; gap:16px; direction:ltr; }
    .note { color:#a6a6ad; font-size:14px; line-height:1.5; direction:rtl; text-align:right; }
    button { border:0; color:#fff; background:#ffffff12; border:1px solid #ffffff18; border-radius:999px; padding:11px 17px; font-weight:700; cursor:pointer; backdrop-filter:blur(12px); }
    button:hover { background:#ffffff1d; }
    @media (max-width:650px) {
      body { padding:12px; }
      .player { border-radius:18px; }
      .top { top:14px; left:14px; right:14px; }
      .round { width:38px; height:38px; font-size:19px; }
      .speed { font-size:16px; }
      .bottom { left:18px; right:18px; bottom:16px; }
      .panel { align-items:flex-start; flex-direction:column; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="player" aria-label="معاينة مؤشر سرعة تحميل الفيديو">
      <div class="scene"></div>
      <div class="chrome">
        <div class="top"><div class="round">‹</div><div class="quality">4K</div></div>
        <div class="bottom">
          <div class="timeline"><span></span></div>
          <div class="meta"><span>19:42</span><span>- 52:48</span></div>
        </div>
      </div>
      <div class="loading" id="loading">
        <div class="loader-card">
          <div class="speed-row">
            <div class="speed"><span id="speed">18.7</span> <small>MB/s</small></div>
            <span class="separator" aria-hidden="true"></span>
            <div class="percent" id="percent">42%</div>
          </div>
        </div>
      </div>
    </section>
    <div class="panel">
      <button id="toggle">إخفاء / إظهار التحميل</button>
      <div class="note">مؤشر صغير وواضح: السرعة تظهر فقط أثناء البفر، ثم تختفي بسلاسة عند بدء الفيديو.</div>
    </div>
  </main>
  <script>
    const loading = document.querySelector('#loading');
    const speed = document.querySelector('#speed');
    const percent = document.querySelector('#percent');
    document.querySelector('#toggle').onclick = () => loading.classList.toggle('hidden');
    let loadedPercent = 42;
    setInterval(() => {
      if (loading.classList.contains('hidden')) return;
      const value = 14 + Math.random() * 9;
      loadedPercent = Math.min(100, loadedPercent + 3 + Math.random() * 5);
      speed.textContent = value.toFixed(1);
      percent.textContent = `${Math.round(loadedPercent)}%`;
      if (loadedPercent >= 100) {
        setTimeout(() => loading.classList.add('hidden'), 450);
      }
    }, 650);
  </script>
</body>
</html>
